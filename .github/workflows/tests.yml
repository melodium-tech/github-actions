name: Mélodium Test

on: workflow_dispatch

jobs:
    call-melodium:
        uses: melodium-tech/github-actions/.github/workflows/melodium.yml@master
        with:
            version: 0.11.0
            artifact-path: 'logs'
            command: run --check-secrets --logs logs/melodium.log .melodium-ci/Compo.toml --repository_clone_url https://github.com/rustls/rustls.git --repository_clone_ref main
        secrets:
            github-token: ${{ secrets.ACCESS_TOKEN }}
            melodium-api-token: ${{ vars.SECRET_MELODIUM_API_JOB_TOKEN }}
    call-melodium-compose:
        uses: melodium-tech/github-actions/.github/workflows/melodium-local-distrib.yml@master
        with:
            version: 0.11.0
            artifact-path: 'logs'
            command: run --check-secrets --logs logs/melodium.log .melodium-ci/Compo.toml --work_location compose --repository_clone_url https://github.com/rustls/rustls.git --repository_clone_ref main --on_github true --ci_service_token env:MELODIUM_SECRET_1 --ci_service_project ${{ github.repository }} --ci_service_sha ${{ github.sha }}
        secrets:
            github-token: ${{ secrets.ACCESS_TOKEN }}
            melodium-api-token: ${{ vars.SECRET_MELODIUM_API_JOB_TOKEN }}
            secret-1: ${{ github.token }}
    call-melodium-macos:
        uses: melodium-tech/github-actions/.github/workflows/melodium-macos.yml@master
        with:
            version: 0.11.0
            artifact-path: 'logs'
